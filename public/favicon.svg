<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Forest Pine into Obsidian -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#244d37"/>
      <stop offset="50%" stop-color="#183626"/>
      <stop offset="100%" stop-color="#0d1f16"/>
    </linearGradient>

    <!-- Champagne Gold Gradient for Sacred / Pattern Lines -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e8cc"/>
      <stop offset="50%" stop-color="#ddbe86"/>
      <stop offset="100%" stop-color="#b69352"/>
    </linearGradient>

    <!-- Radial Glow Behind the Core -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ddbe86" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ddbe86" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Squircle Plate with Soft Border -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="16" stroke="url(#gold)" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Center Ambient Glow -->
  <circle cx="32" cy="32" r="20" fill="url(#glow)"/>

  <!-- Resonant Pattern Rings (System & Silence) -->
  <circle cx="32" cy="32" r="22" stroke="url(#gold)" stroke-width="0.8" stroke-dasharray="2 3.5" stroke-opacity="0.4"/>
  <circle cx="32" cy="32" r="16.5" stroke="#fbfbfa" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Stylized "A" (Ascending Focus / Intellect / Upward Striving) -->
  <path d="M 19 30 L 32 13 L 45 30" stroke="#fbfbfa" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 23.5 24.5 L 40.5 24.5" stroke="url(#gold)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Stylized "V" (Vaelen / Downward Depth / Service / Rootedness) -->
  <path d="M 19 34 L 32 51 L 45 34" stroke="#fbfbfa" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 23.5 39.5 L 40.5 39.5" stroke="url(#gold)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Central Focal Diamond & Cross-point (Faith & Quiet Center) -->
  <polygon points="32,26.5 36,32 32,37.5 28,32" fill="url(#gold)"/>
  <circle cx="32" cy="32" r="1.6" fill="#ffffff"/>

  <!-- Micro Axis Nodes -->
  <circle cx="32" cy="8.5" r="1.2" fill="url(#gold)"/>
  <circle cx="32" cy="55.5" r="1.2" fill="url(#gold)"/>
</svg>
